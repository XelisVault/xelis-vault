# ============================================================================
# strict-ci — XelisVault protocol CI
# ----------------------------------------------------------------------------
# Every push / pull-request on main must pass ALL four gates. The gates encode
# the findings of the v12 security audit:
#   silex-lint  : the 10 dangerous Silex patterns (swallowed transfers, rug
#                 switches, unguarded panics, 68-hex literals, ...) — a single
#                 BLOCKER/ERROR fails the build
#   chunk-ids   : documented chunk tables match the real XELIS entry-point
#                 numbering, and the mixer keeps ZERO inter-contract calls
#   tests       : pytest functional suite (sanity placeholder included so the
#                 job is never empty)
#   structure   : repo layout, no legacy imports, no secrets, no blobs
# ============================================================================
name: strict-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel superseded runs of the same branch
concurrency:
  group: strict-ci-${{ github.ref }}
  cancel-in-progress: true

# least privilege
permissions:
  contents: read

jobs:
  silex-lint:
    name: "Silex lint (static security analysis)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lint_silex.py on contracts/ (legacy/ excluded)
        run: python scripts/lint_silex.py --contracts contracts --json reports/lint-report.json
      - name: Upload lint report (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/lint-report.json
          if-no-files-found: warn

  chunk-ids:
    name: "Chunk IDs & inter-contract calls"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verify_chunk_ids.py
        run: python scripts/verify_chunk_ids.py --contracts contracts

  compile:
    name: "Silex compile + ABI parity (real compiler)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download the pinned silex-cli v1.0.0 release binary
        run: |
          curl -fsSL -o silex-cli \
            https://github.com/xelis-project/silex-cli/releases/download/v1.0.0/silex-cli-linux-x86_64
          chmod +x silex-cli
          ./silex-cli compile --help >/dev/null
      - name: Compile every contract + pin the ABIs (silex_compile_check.py)
        env:
          SILEX_CLI: "${{ github.workspace }}/silex-cli"
        run: python scripts/silex_compile_check.py

  tests:
    name: "Functional tests (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (SDK incl. blake3)
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check ./sdk/xvault
      - name: Run pytest on tests/
        run: python -m pytest tests -v

  structure:
    name: "Repo structure, legacy isolation & secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check_structure.py
        run: python scripts/check_structure.py

  audits:
    name: "Formal audits (spec traceability, security, SDK parity, doc parity)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK (reader imports; pytest for the v4.1 fuzz's
          model imports)
        run: python -m pip install --disable-pip-version-check
          ./sdk/xvault pytest
      - name: AUDIT 1 - founder-requirement traceability (30 checks)
        run: python scripts/audit_v4_spec.py
      - name: AUDIT 2 - mechanical security pass
        run: python scripts/audit_v4_security.py
      - name: AUDIT 3 - v4.1 hardening fuzz (D21/X7/IX6, 40 seeds)
        run: python scripts/audit_v41_fuzz.py
      - name: AUDIT 4 - SDK parity (both contracts)
        run: python scripts/audit_v4_sdk.py
      - name: AUDIT 5 - doc parity (contract <-> docs <-> SDK)
        run: python scripts/audit_doc_parity.py
      - name: PASS 3 - independent economics re-derivation
        run: python scripts/verify_pass3_math.py
      - name: PASS 4 - cross-contract parity (calls, signatures, ABI)
        run: python scripts/verify_pass4_parity.py
